<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio Viewer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  padding: 20px;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}

/* CARD FISSA */
.card {
  width: 620px;
  height: 420px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.card-header {
  height: 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 12px;
  background: #1f242c;
}

.title { font-weight: bold; }

.github-btn {
  background: #2f81f7;
  color: white;
  padding: 5px 8px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 12px;
}

/* VIEWER SEMPRE UGUALE */
.viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* SPAZIO FISSO MEDIA */
.media-box {
  width: 100%;
  height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* MEDIA NON CAMBIA LAYOUT */
canvas, img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  background: white;
  border-radius: 6px;
}

canvas {
  display: block;
}

/* CONTROLLI SEMPRE UGUALI */
.controls {
  height: 40px;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  margin-top: 8px;
}

button {
  background: #2f81f7;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

button:disabled { opacity: 0.4; }

.page {
  font-size: 12px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* DATA */
const state = {
  items: [
    {
      title: "e-Borrow",
      url: "https://github.com/andreamirarchi/e-Borrow",
      type: "images",
      images: [
        "images/eBorrow/1.png",
        "images/eBorrow/2.png",
      ]
    },
    {
      title: "E20Master",
      url: "https://github.com/Piero23/E20Master",
      type: "images",
      images: [
        "images/e20/E20_app1.png",
        "images/e20/E20_app2.png",
        "images/e20/E20_app3.jpg",
        "images/e20/E20_app4.jpg"
      ]
    },
    {
      title: "School Manager",
      url: "https://github.com/domenicosantagada/Progetto_School_Manager_INGSW_2025",
      type: "images",
      images: [
        "images/schoolmanager/1.png",
        "images/schoolmanager/2.png",
        "images/schoolmanager/3.png",
        "images/schoolmanager/4.png"
      ]
    },
    {
      title: "Sito Annunci",
      url: "https://github.com/vincenzosacco/SitoAnnunci",
      type: "pdf",
      file: "pdf/we-bay.pdf"
    },
    {
      title: "Auditory Debugger",
      url: "https://github.com/andreamirarchi/auditory_debugger",
      type: "pdf",
      file: "pdf/wypcsl.pdf"
    }
  ]
};

/* CARD */
function createCard(repo) {

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="card-header">
      <div class="title">${repo.title}</div>
      <a class="github-btn" href="${repo.url}" target="_blank">GitHub Link</a>
    </div>

    <div class="viewer">
      <div class="media-box"></div>
      <div class="controls"></div>
    </div>
  `;

  loadViewer(repo, card.querySelector(".media-box"), card.querySelector(".controls"));

  return card;
}

/* VIEWER */
async function loadViewer(repo, box, controls) {

  controls.innerHTML = "";
  box.innerHTML = "";

  /* ================= IMAGES ================= */
  if (repo.type === "images") {

    let i = 0;

    const img = document.createElement("img");
    box.appendChild(img);

    const prev = document.createElement("button");
    const next = document.createElement("button");
    const label = document.createElement("div");

    prev.textContent = "←";
    next.textContent = "→";

    controls.appendChild(prev);
    controls.appendChild(label);
    controls.appendChild(next);

    function render(n) {
      img.src = repo.images[n];
      label.textContent = `${n + 1} / ${repo.images.length}`;
      prev.disabled = n === 0;
      next.disabled = n === repo.images.length - 1;
    }

    prev.onclick = () => render(--i);
    next.onclick = () => render(++i);

    render(i);
  }

  /* ================= PDF ================= */
  else if (repo.type === "pdf") {

    const pdf = await pdfjsLib.getDocument(repo.file).promise;

    let page = 1;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    box.appendChild(canvas);

    const prev = document.createElement("button");
    const next = document.createElement("button");
    const label = document.createElement("div");

    prev.textContent = "←";
    next.textContent = "→";

    controls.appendChild(prev);
    controls.appendChild(label);
    controls.appendChild(next);

    async function renderPage(n) {
      const p = await pdf.getPage(n);

      const dpr = window.devicePixelRatio || 1;
      const baseViewport = p.getViewport({ scale: 1 });

      const targetCssWidth = Math.min(box.clientWidth || 560, 560);
      const scale = (targetCssWidth * dpr) / baseViewport.width;

      const viewport = p.getViewport({ scale });

      const temp = document.createElement("canvas");
      const tctx = temp.getContext("2d");

      temp.width = viewport.width;
      temp.height = viewport.height;

      await p.render({ canvasContext: tctx, viewport }).promise;

      let sx = 0;
      let sy = 0;
      let sw = temp.width;
      let sh = temp.height;

      if (repo.file.includes("we-bay") || repo.file.includes("wypcsl")) {
        const ratio = 16 / 9;

        if (sw / sh > ratio) {
          sw = Math.round(sh * ratio);
          sx = Math.round((temp.width - sw) / 2);
        } else {
          sh = Math.round(sw / ratio);
          sy = Math.round((temp.height - sh) / 2);
        }
      }

      canvas.width = sw;
      canvas.height = sh;
      canvas.style.width = `${sw / dpr}px`;
      canvas.style.height = `${sh / dpr}px`;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, sw, sh);
      ctx.drawImage(temp, sx, sy, sw, sh, 0, 0, sw, sh);

      label.textContent = `${n} / ${pdf.numPages}`;

      prev.disabled = n <= 1;
      next.disabled = n >= pdf.numPages;
    }

    prev.onclick = () => renderPage(--page);
    next.onclick = () => renderPage(++page);

    renderPage(page);
  }
}

/* RENDER */
function render() {
  const app = document.getElementById("app");
  state.items.forEach(p => app.appendChild(createCard(p)));
}

render();

</script>

</body>
</html>
