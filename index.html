<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio Viewer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  padding: 20px;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}

.card {
  width: 620px;
  height: 420px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.card-header {
  height: 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 12px;
  background: #1f242c;
}

.title {
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
}

.badges {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 6px;
  background: #2f81f7;
  color: white;
}

.github-btn {
  background: #ffffff;
  color: #0d1117;
  padding: 6px 10px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  border: 1px solid #d0d7de;
}

.viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.media-box {
  width: 100%;
  height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

canvas, img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  background: white;
  border-radius: 6px;
}

/* CONTROLLI UGUALI */
.controls {
  height: 40px;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  margin-top: 8px;
}

button {
  background: #2f81f7;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

button:disabled { opacity: 0.4; }

/* 📱 SOLO RESPONSIVE SEMPLICE (non cambia layout interno) */
@media (max-width: 650px) {
  .card {
    width: 95vw;
  }
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* DATA */
const state = {
  items: [
    {
      title: "e-Borrow",
      url: "https://github.com/andreamirarchi/e-Borrow",
      type: "images",
      languages: ["Python", "Flask"],
      images: ["images/eBorrow/1.png","images/eBorrow/2.png"]
    },
    {
      title: "E20",
      url: "https://github.com/Piero23/E20Master",
      type: "images",
      languages: ["Java", "Spring", "Kotlin", "TypeScript", "Angular"],
      images: [
        "images/e20/E20_app1.png",
        "images/e20/E20_app2.png",
        "images/e20/E20_app3.jpg",
        "images/e20/E20_app4.jpg"
      ]
    },
    {
      title: "School Manager",
      url: "https://github.com/domenicosantagada/Progetto_School_Manager_INGSW_2025",
      type: "images",
      languages: ["Java"],
      images: [
        "images/schoolmanager/1.png",
        "images/schoolmanager/2.png",
        "images/schoolmanager/3.png",
        "images/schoolmanager/4.png"
      ]
    },
    {
      title: "We-bay (sito annunci)",
      url: "https://github.com/vincenzosacco/SitoAnnunci",
      type: "pdf",
      languages: ["TypeScript", "Angular", "Java", "Spring"],
      file: "pdf/we-bay.pdf"
    },
    {
      title: "Auditory Debugger",
      url: "https://github.com/andreamirarchi/auditory_debugger",
      type: "pdf",
      languages: ["Python"],
      file: "pdf/wypcsl.pdf"
    }
  ]
};

/* CARD */
function createCard(repo) {

  const card = document.createElement("div");
  card.className = "card";

  const badges = (repo.languages || [])
    .map(l => `<span class="badge">${l}</span>`)
    .join("");

  card.innerHTML = `
    <div class="card-header">
      <div class="title">
        ${repo.title}
        <div class="badges">${badges}</div>
      </div>
      <a class="github-btn" href="${repo.url}" target="_blank">
  <svg height="14" width="14" viewBox="0 0 16 16" fill="black" aria-hidden="true">
    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
    0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
    -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
    .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
    -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
    .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
    .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
    0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8
    c0-4.42-3.58-8-8-8z"/>
  </svg>
  GitHub project
</a>
    </div>

    <div class="viewer">
      <div class="media-box"></div>
      <div class="controls"></div>
    </div>
  `;

  loadViewer(repo, card.querySelector(".media-box"), card.querySelector(".controls"));

  return card;
}

/* VIEWER (IDENTICO AL TUO ORIGINALE) */
async function loadViewer(repo, box, controls) {

  controls.innerHTML = "";
  box.innerHTML = "";

  /* IMAGES */
  if (repo.type === "images") {

    let i = 0;

    const img = document.createElement("img");
    box.appendChild(img);

    const prev = document.createElement("button");
    const next = document.createElement("button");
    const label = document.createElement("div");

    prev.textContent = "←";
    next.textContent = "→";

    controls.appendChild(prev);
    controls.appendChild(label);
    controls.appendChild(next);

    function render(n) {
      img.src = repo.images[n];
      label.textContent = `${n + 1} / ${repo.images.length}`;
      prev.disabled = n === 0;
      next.disabled = n === repo.images.length - 1;
    }

    prev.onclick = () => render(--i);
    next.onclick = () => render(++i);

    render(i);
  }

  /* PDF */
  else if (repo.type === "pdf") {

    const pdf = await pdfjsLib.getDocument(repo.file).promise;

    let page = 1;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    box.appendChild(canvas);

    const prev = document.createElement("button");
    const next = document.createElement("button");
    const label = document.createElement("div");

    prev.textContent = "←";
    next.textContent = "→";

    controls.appendChild(prev);
    controls.appendChild(label);
    controls.appendChild(next);

    async function renderPage(n) {
      const p = await pdf.getPage(n);

      const dpr = window.devicePixelRatio || 1;
      const baseViewport = p.getViewport({ scale: 1 });

      const targetCssWidth = Math.min(box.clientWidth || 560, 560);
      const scale = (targetCssWidth * dpr) / baseViewport.width;

      const viewport = p.getViewport({ scale });

      const temp = document.createElement("canvas");
      const tctx = temp.getContext("2d");

      temp.width = viewport.width;
      temp.height = viewport.height;

      await p.render({ canvasContext: tctx, viewport }).promise;

      let sx = 0;
      let sy = 0;
      let sw = temp.width;
      let sh = temp.height;

      /* 🔥 RIPRISTINO LOGICA 16:9 */
      if (repo.file.includes("we-bay") || repo.file.includes("wypcsl")) {
        const ratio = 16 / 9;

        if (sw / sh > ratio) {
          sw = Math.round(sh * ratio);
          sx = Math.round((temp.width - sw) / 2);
        } else {
          sh = Math.round(sw / ratio);
          sy = Math.round((temp.height - sh) / 2);
        }
      }

      canvas.width = sw;
      canvas.height = sh;

      canvas.style.width = `${sw / dpr}px`;
      canvas.style.height = `${sh / dpr}px`;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, sw, sh);
      ctx.drawImage(temp, sx, sy, sw, sh, 0, 0, sw, sh);

      label.textContent = `${n} / ${pdf.numPages}`;

      prev.disabled = n <= 1;
      next.disabled = n >= pdf.numPages;
    }

    prev.onclick = () => renderPage(--page);
    next.onclick = () => renderPage(++page);

    renderPage(page);
  }
}

/* RENDER */
function render() {
  const app = document.getElementById("app");
  state.items.forEach(p => app.appendChild(createCard(p)));
}

render();

</script>

</body>
</html>
